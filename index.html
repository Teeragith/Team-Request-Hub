<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Request Hub</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

  /* NAV */
  nav {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  nav .brand { color: #e94560; font-weight: 700; font-size: 1.2rem; letter-spacing: 1px; }
  nav .nav-tabs { display: flex; gap: 0; }
  nav .tab-btn {
    background: none; border: none; color: #aaa; padding: 0 1.2rem; height: 60px;
    cursor: pointer; font-size: 0.9rem; transition: all 0.2s; border-bottom: 3px solid transparent;
  }
  nav .tab-btn:hover { color: #fff; }
  nav .tab-btn.active { color: #e94560; border-bottom-color: #e94560; }
  nav .role-badge {
    background: #e94560; color: #fff; padding: 4px 12px; border-radius: 20px;
    font-size: 0.75rem; font-weight: 600; cursor: pointer; user-select: none;
  }

  /* PAGES */
  .page { display: none; padding: 2rem; max-width: 1100px; margin: 0 auto; }
  .page.active { display: block; }

  /* CARDS */
  .card {
    background: #fff; border-radius: 12px; padding: 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1.5rem;
  }
  .card h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #1a1a2e; }

  /* STAT GRID */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .stat-card {
    background: #fff; border-radius: 12px; padding: 1.2rem 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center;
    border-top: 4px solid transparent;
  }
  .stat-card.all   { border-color: #6c63ff; }
  .stat-card.wait  { border-color: #f59e0b; }
  .stat-card.doing { border-color: #3b82f6; }
  .stat-card.done  { border-color: #10b981; }
  .stat-card .num  { font-size: 2rem; font-weight: 700; margin-bottom: 4px; }
  .stat-card.all   .num { color: #6c63ff; }
  .stat-card.wait  .num { color: #f59e0b; }
  .stat-card.doing .num { color: #3b82f6; }
  .stat-card.done  .num { color: #10b981; }
  .stat-card .label { font-size: 0.8rem; color: #888; }

  /* FORM */
  .form-group { margin-bottom: 1rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #555; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; border: 1.5px solid #e0e0e0; border-radius: 8px;
    font-size: 0.95rem; transition: border 0.2s; background: #fafafa;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #6c63ff; background: #fff; }
  textarea { resize: vertical; min-height: 90px; }
  .btn {
    padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 0.95rem; font-weight: 600; transition: all 0.2s;
  }
  .btn-primary { background: #6c63ff; color: #fff; }
  .btn-primary:hover { background: #574fd6; transform: translateY(-1px); }
  .btn-sm { padding: 5px 14px; font-size: 0.8rem; border-radius: 6px; }

  /* URGENCY */
  .urgency { display: flex; gap: 0.75rem; }
  .urgency-opt { flex: 1; }
  .urgency-opt input[type=radio] { display: none; }
  .urgency-opt label {
    display: block; text-align: center; padding: 8px;
    border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer;
    font-size: 0.85rem; transition: all 0.2s; margin: 0;
  }
  .urgency-opt input:checked + label { color: #fff; border-color: transparent; }
  .urgency-low   input:checked + label { background: #10b981; }
  .urgency-med   input:checked + label { background: #f59e0b; }
  .urgency-high  input:checked + label { background: #ef4444; }

  /* REQUEST LIST */
  .filters { display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  .filter-btn {
    padding: 6px 16px; border-radius: 20px; border: 2px solid #e0e0e0;
    background: #fff; cursor: pointer; font-size: 0.82rem; font-weight: 600; transition: all 0.2s;
  }
  .filter-btn.active { border-color: #6c63ff; background: #6c63ff; color: #fff; }
  .search-box { flex: 1; min-width: 180px; }
  .search-box input { padding: 7px 12px; }

  .request-item {
    background: #fff; border-radius: 10px; padding: 1rem 1.2rem;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07); margin-bottom: 0.75rem;
    border-left: 4px solid #ccc; display: flex; align-items: flex-start; gap: 1rem;
  }
  .request-item.low    { border-color: #10b981; }
  .request-item.medium { border-color: #f59e0b; }
  .request-item.high   { border-color: #ef4444; }

  .req-info { flex: 1; }
  .req-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
  .req-desc  { font-size: 0.85rem; color: #666; margin-bottom: 6px; line-height: 1.5; }
  .req-meta  { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
  .badge {
    padding: 3px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
  }
  .badge-low    { background: #d1fae5; color: #065f46; }
  .badge-medium { background: #fef3c7; color: #92400e; }
  .badge-high   { background: #fee2e2; color: #991b1b; }
  .badge-wait   { background: #e0e7ff; color: #3730a3; }
  .badge-doing  { background: #dbeafe; color: #1e40af; }
  .badge-done   { background: #d1fae5; color: #065f46; }
  .req-date { font-size: 0.75rem; color: #aaa; }

  .req-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; min-width: 110px; }
  .status-select {
    padding: 5px 10px; border: 1.5px solid #e0e0e0; border-radius: 6px;
    font-size: 0.8rem; cursor: pointer; background: #f9f9f9;
  }
  .delete-btn {
    background: none; border: none; color: #ccc; cursor: pointer; font-size: 0.75rem;
    padding: 2px 6px; border-radius: 4px; transition: all 0.2s;
  }
  .delete-btn:hover { color: #ef4444; background: #fee2e2; }

  .empty-state { text-align: center; padding: 3rem; color: #bbb; }
  .empty-state .icon { font-size: 3rem; margin-bottom: 0.5rem; }

  /* SUCCESS TOAST */
  .toast {
    position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: #fff;
    padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 0.9rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2); transform: translateY(100px); opacity: 0;
    transition: all 0.3s; z-index: 999;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* TIMELINE */
  .timeline { border-left: 2px solid #e0e0e0; padding-left: 1.2rem; margin-top: 0.5rem; }
  .tl-item { position: relative; margin-bottom: 0.75rem; }
  .tl-item::before {
    content: ''; position: absolute; left: -1.5rem; top: 6px;
    width: 10px; height: 10px; border-radius: 50%; background: #6c63ff;
  }
  .tl-item .tl-text { font-size: 0.82rem; color: #555; }
  .tl-item .tl-date { font-size: 0.72rem; color: #aaa; }

  @media (max-width: 600px) {
    .page { padding: 1rem; }
    nav .brand { font-size: 1rem; }
    .request-item { flex-direction: column; }
    .req-actions { flex-direction: row; flex-wrap: wrap; }
  }
</style>
</head>
<body>

<nav>
  <div class="brand">Team Request Hub</div>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('submit')">ส่งคำขอ</button>
    <button class="tab-btn" onclick="switchTab('dashboard')" id="dashTab">Dashboard</button>
  </div>
  <div class="role-badge" onclick="toggleRole()" id="roleBadge">ทีมงาน</div>
</nav>

<!-- SUBMIT PAGE -->
<div class="page active" id="page-submit">
  <div class="card" style="max-width:600px;margin:0 auto;">
    <h2>ส่งคำขอใหม่</h2>
    <form id="requestForm">
      <div class="form-group">
        <label>ชื่อผู้ส่ง</label>
        <input type="text" id="senderName" placeholder="ระบุชื่อของคุณ" required>
      </div>
      <div class="form-group">
        <label>ชื่อเรื่อง</label>
        <input type="text" id="reqTitle" placeholder="ระบุหัวข้อคำขอ" required>
      </div>
      <div class="form-group">
        <label>รายละเอียด</label>
        <textarea id="reqDesc" placeholder="อธิบายรายละเอียดของคำขอ..." required></textarea>
      </div>
      <div class="form-group">
        <label>ความเร่งด่วน</label>
        <div class="urgency">
          <div class="urgency-opt urgency-low">
            <input type="radio" name="urgency" id="u-low" value="low" checked>
            <label for="u-low">ต่ำ</label>
          </div>
          <div class="urgency-opt urgency-med">
            <input type="radio" name="urgency" id="u-med" value="medium">
            <label for="u-med">ปานกลาง</label>
          </div>
          <div class="urgency-opt urgency-high">
            <input type="radio" name="urgency" id="u-high" value="high">
            <label for="u-high">เร่งด่วน</label>
          </div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">ส่งคำขอ</button>
    </form>
    <div id="successMsg" style="display:none;margin-top:1rem;padding:12px 16px;background:#d1fae5;border:1.5px solid #6ee7b7;border-radius:8px;color:#065f46;font-weight:600;text-align:center;">
      บันทึกคำขอเรียบร้อยแล้ว!
    </div>
  </div>
</div>

<!-- DASHBOARD PAGE -->
<div class="page" id="page-dashboard">
  <div class="stat-grid" id="statsGrid"></div>

  <div class="card">
    <h2>รายการคำขอทั้งหมด</h2>
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">ทั้งหมด</button>
      <button class="filter-btn" onclick="setFilter('waiting', this)">รอดำเนินการ</button>
      <button class="filter-btn" onclick="setFilter('in-progress', this)">กำลังทำ</button>
      <button class="filter-btn" onclick="setFilter('done', this)">เสร็จแล้ว</button>
      <div class="search-box">
        <input type="text" id="searchBox" placeholder="ค้นหา..." oninput="renderList()">
      </div>
    </div>
    <div id="requestList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let requests = JSON.parse(localStorage.getItem('teamRequests') || '[]');
let currentFilter = 'all';
let isManager = false;

function save() {
  localStorage.setItem('teamRequests', JSON.stringify(requests));
}

function showToast(msg, color = '#10b981') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function toggleRole() {
  isManager = !isManager;
  const badge = document.getElementById('roleBadge');
  const dashTab = document.getElementById('dashTab');
  if (isManager) {
    badge.textContent = 'หัวหน้า';
    badge.style.background = '#6c63ff';
    dashTab.style.display = '';
  } else {
    badge.textContent = 'ทีมงาน';
    badge.style.background = '#e94560';
    dashTab.style.display = 'none';
    if (document.getElementById('page-dashboard').classList.contains('active')) {
      switchTab('submit');
    }
  }
}

function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  event && event.target.classList.add('active');
  if (tab === 'dashboard') renderDashboard();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

document.getElementById('requestForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const urgency = document.querySelector('input[name=urgency]:checked').value;
  const req = {
    id: Date.now(),
    sender: document.getElementById('senderName').value.trim(),
    title: document.getElementById('reqTitle').value.trim(),
    desc: document.getElementById('reqDesc').value.trim(),
    urgency,
    status: 'waiting',
    createdAt: new Date().toISOString(),
    history: [{ text: 'ส่งคำขอแล้ว', at: new Date().toISOString() }]
  };
  requests.unshift(req);
  save();
  this.reset();
  document.getElementById('u-low').checked = true;
  const msg = document.getElementById('successMsg');
  msg.style.display = 'block';
  setTimeout(() => { msg.style.display = 'none'; }, 3000);
});

function updateStatus(id, newStatus) {
  const r = requests.find(x => x.id === id);
  if (!r) return;
  const labels = { waiting: 'รอดำเนินการ', 'in-progress': 'กำลังดำเนินการ', done: 'เสร็จแล้ว' };
  r.status = newStatus;
  r.history.push({ text: 'เปลี่ยนสถานะเป็น: ' + labels[newStatus], at: new Date().toISOString() });
  save();
  renderDashboard();
  showToast('อัปเดตสถานะแล้ว', '#6c63ff');
}

function deleteRequest(id) {
  if (!confirm('ลบคำขอนี้?')) return;
  requests = requests.filter(x => x.id !== id);
  save();
  renderDashboard();
  showToast('ลบคำขอแล้ว', '#ef4444');
}

function fmt(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' })
    + ' ' + d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
}

const urgencyLabel = { low: 'ต่ำ', medium: 'ปานกลาง', high: 'เร่งด่วน' };
const statusLabel  = { waiting: 'รอดำเนินการ', 'in-progress': 'กำลังทำ', done: 'เสร็จแล้ว' };
const statusClass  = { waiting: 'wait', 'in-progress': 'doing', done: 'done' };

function renderDashboard() {
  renderStats();
  renderList();
}

function renderStats() {
  const total   = requests.length;
  const waiting = requests.filter(r => r.status === 'waiting').length;
  const doing   = requests.filter(r => r.status === 'in-progress').length;
  const done    = requests.filter(r => r.status === 'done').length;
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card all">  <div class="num">${total}</div>   <div class="label">คำขอทั้งหมด</div></div>
    <div class="stat-card wait"> <div class="num">${waiting}</div>  <div class="label">รอดำเนินการ</div></div>
    <div class="stat-card doing"><div class="num">${doing}</div>   <div class="label">กำลังดำเนินการ</div></div>
    <div class="stat-card done"> <div class="num">${done}</div>    <div class="label">เสร็จแล้ว</div></div>
  `;
}

function renderList() {
  const q = (document.getElementById('searchBox').value || '').toLowerCase();
  let list = requests.filter(r => {
    const matchFilter = currentFilter === 'all' || r.status === currentFilter;
    const matchSearch = !q || r.title.toLowerCase().includes(q)
      || r.sender.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });

  const el = document.getElementById('requestList');
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div>ไม่มีคำขอในรายการ</div></div>`;
    return;
  }

  el.innerHTML = list.map(r => `
    <div class="request-item ${r.urgency}">
      <div class="req-info">
        <div class="req-title">${r.title}</div>
        <div class="req-desc">${r.desc}</div>
        <div class="req-meta">
          <span class="badge badge-${r.urgency}">${urgencyLabel[r.urgency]}</span>
          <span class="badge badge-${statusClass[r.status]}">${statusLabel[r.status]}</span>
          <span class="req-date">โดย ${r.sender}</span>
          <span class="req-date">${fmt(r.createdAt)}</span>
        </div>
      </div>
      <div class="req-actions">
        <select class="status-select" onchange="updateStatus(${r.id}, this.value)">
          <option value="waiting"     ${r.status==='waiting'     ?'selected':''}>รอดำเนินการ</option>
          <option value="in-progress" ${r.status==='in-progress' ?'selected':''}>กำลังทำ</option>
          <option value="done"        ${r.status==='done'        ?'selected':''}>เสร็จแล้ว</option>
        </select>
        <button class="delete-btn" onclick="deleteRequest(${r.id})">ลบ</button>
      </div>
    </div>
  `).join('');
}

// init as team member
document.getElementById('dashTab').style.display = 'none';
document.querySelector('.tab-btn').classList.add('active');
</script>
</body>
</html>
